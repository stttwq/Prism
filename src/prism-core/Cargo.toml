[package]
name = "prism-core"
# 2026-08-24 复审：与安装包 1.1 线对齐（此前 crate 0.1.0 / csproj 1.0.0 /
# installer 1.1.x 三处互不相干；Hello/Pong 上报的 version 就是 crate 版本）。
version = "1.1.0"
edition = "2021"
description = "Prism 后端：文件索引 / 搜索 / 程序清单 / 网页关键词，命名管道 JSON 服务"

[[bin]]
name = "prism-core"
path = "src/main.rs"

[[bin]]
name = "prism-indexer-service"
path = "src/prism-indexer-service.rs"

[[bin]]
name = "pinyin-sidecar-prototype"
path = "tools/pinyin-sidecar-prototype.rs"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "net", "macros", "time", "sync"] }
# 目录遍历（降级路径全盘扫描）
walkdir = "2"
# 索引磁盘缓存：紧凑二进制序列化，no_std 友好、体积小
# use-std 启用 to_io：checkpoint 直接流式写入文件，不再生成整份序列化 Vec（内存峰值 3x→2x）
postcard = { version = "1", features = ["alloc", "use-std"] }
# P1-2（搜索报告2）：heteronym 启用多音字多读音（ToPinyinMulti），
# 编码与匹配对多读音 token 逐读音分支尝试。
pinyin = { version = "0.10.0", default-features = false, features = ["plain", "heteronym"] }
windows-service = "0.8"

# MFT/USN 加速仅在 Windows 用到；非 Windows（如 CI Linux）自动省略，走目录遍历。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    # G5: DWMWA_CLOAKED。只用 DWM_CLOAKED_APP 排除；「其他虚拟桌面」由 Win32_UI_Shell
    # 的 IVirtualDesktopManager 判定，因为 DWM_CLOAKED_SHELL 分不开挂起的 UWP。
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Authorization",
    # K4a：BCryptGenRandom（{uuid} 占位符熵源）。
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3       # 搜索热路径吞吐优先（对标 Everything 的响应速度）；体积增大约 1-2MB
lto = true
codegen-units = 1
panic = "abort"
strip = true
