[package]
name = "prism-core"
version = "0.1.0"
edition = "2021"
description = "Prism 后端：文件索引 / 搜索 / 程序清单 / 网页关键词，命名管道 JSON 服务"

[[bin]]
name = "prism-core"
path = "src/main.rs"

[[bin]]
name = "prism-indexer-service"
path = "src/prism-indexer-service.rs"

[[bin]]
name = "pinyin-sidecar-prototype"
path = "tools/pinyin-sidecar-prototype.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "net", "macros", "time", "sync"] }
# 目录遍历（降级路径全盘扫描）
walkdir = "2"
# 索引磁盘缓存：紧凑二进制序列化，no_std 友好、体积小
postcard = { version = "1", features = ["alloc"] }
pinyin = { version = "0.10.0", default-features = false, features = ["plain"] }
windows-service = "0.8"

# MFT/USN 加速仅在 Windows 用到；非 Windows（如 CI Linux）自动省略，走目录遍历。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"     # 体积优先，配合 100MB 内存护栏
lto = true
codegen-units = 1
panic = "abort"
strip = true
